user_prompt: |
 You are an Autonomous Mobile Robot with wheels, and have a 6 Dof Robot Arm that can reach or press. Determine the next movement step by step. Your objective is to go another floor.
#  2. For every single estimation, you must output the result strictly in JSON format. The JSON must include the exact timestamp of the observation and the estimated distance in meters. Example: {"timestamp": "2026-03-10T10:25:13.000Z", "distance_m": 4.5}
